name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: android/app/dilo-debug.keystore
          key: dilo-debug-keystore-v1

      - name: Firma estable
        working-directory: android/app
        run: |
          if [ ! -f dilo-debug.keystore ]; then
            keytool -genkeypair -keystore dilo-debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Dilo,O=Dilo,C=BO"
          fi

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dilo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar en Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Sin secretos de Supabase. El APK queda como artefacto de este workflow."
            exit 0
          fi
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          curl -sS -o /dev/null -X POST "${SUPABASE_URL}/storage/v1/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"apk","name":"apk","public":false,"fileSizeLimit":104857600}' || true
          CODIGO=$(curl -sS -o /tmp/apk-upload.json -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/apk/dilo.apk" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${APK}")
          if [ "${CODIGO}" != "200" ] && [ "${CODIGO}" != "201" ]; then
            CODIGO=$(curl -sS -o /tmp/apk-upload.json -w "%{http_code}" -X PUT \
              "${SUPABASE_URL}/storage/v1/object/apk/dilo.apk" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "x-upsert: true" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@${APK}")
          fi
          echo "Storage HTTP ${CODIGO}"
          if [ "${CODIGO}" != "200" ] && [ "${CODIGO}" != "201" ]; then
            cat /tmp/apk-upload.json
            exit 1
          fi
