name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apk]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir versión
        id: ver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 android/scripts/bump-version.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: android/app/dilo-debug.keystore
          key: dilo-debug-keystore-v1

      - name: Firma estable
        working-directory: android/app
        run: |
          if [ ! -f dilo-debug.keystore ]; then
            keytool -genkeypair -keystore dilo-debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Dilo,O=Dilo,C=BO"
          fi

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Dilo-${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar en Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_VERSION: ${{ steps.ver.outputs.name }}
          APK_CODE: ${{ steps.ver.outputs.code }}
          APK_ARCHIVO: ${{ steps.ver.outputs.archivo }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Sin secretos de Supabase. El APK queda como artefacto de este workflow."
            exit 0
          fi
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "${APK}" "/tmp/${APK_ARCHIVO}"
          printf '{"version":"%s","versionCode":%s,"archivo":"%s"}\n' \
            "${APK_VERSION}" "${APK_CODE}" "${APK_ARCHIVO}" > /tmp/latest.json
          curl -sS -o /dev/null -X POST "${SUPABASE_URL}/storage/v1/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"apk","name":"apk","public":false,"fileSizeLimit":104857600}' || true
          subir() {
            local ruta="$1"
            local tipo="$2"
            local archivo="$3"
            local codigo
            codigo=$(curl -sS -o /tmp/apk-upload.json -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/storage/v1/object/apk/${ruta}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "x-upsert: true" \
              -H "Content-Type: ${tipo}" \
              --data-binary "@${archivo}")
            if [ "${codigo}" != "200" ] && [ "${codigo}" != "201" ]; then
              codigo=$(curl -sS -o /tmp/apk-upload.json -w "%{http_code}" -X PUT \
                "${SUPABASE_URL}/storage/v1/object/apk/${ruta}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "x-upsert: true" \
                -H "Content-Type: ${tipo}" \
                --data-binary "@${archivo}")
            fi
            echo "${ruta} HTTP ${codigo}"
            if [ "${codigo}" != "200" ] && [ "${codigo}" != "201" ]; then
              cat /tmp/apk-upload.json
              exit 1
            fi
          }
          subir "${APK_ARCHIVO}" "application/vnd.android.package-archive" "/tmp/${APK_ARCHIVO}"
          # La cubeta apk no admite application/json; octet-stream sí.
          subir "latest.json" "application/octet-stream" "/tmp/latest.json"

      - name: Guardar versión en el repo
        if: github.ref == 'refs/heads/main'
        env:
          APK_VERSION: ${{ steps.ver.outputs.name }}
          APK_CODE: ${{ steps.ver.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/version.properties
          if git diff --cached --quiet; then
            echo "La versión no cambió."
            exit 0
          fi
          git commit -m "chore(android): versión ${APK_VERSION} (${APK_CODE}) [skip apk]"
          git push origin HEAD:main
